<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dots – Jahres-Tracker</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0e;--card:#16161b;--line:#26262e;--txt:#f4f4f6;--mut:#8a8a96;--h:150;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:18px 14px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0;font-weight:600}
.yr{display:flex;align-items:center;gap:10px}
.yr button{background:var(--card);border:1px solid var(--line);color:var(--txt);width:34px;height:34px;border-radius:10px;font-size:16px}
.yr span{font-variant-numeric:tabular-nums;font-weight:600}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.tab{flex:none;background:var(--card);border:1px solid var(--line);color:var(--mut);padding:9px 14px;border-radius:999px;font-size:14px;white-space:nowrap}
.tab.on{color:#fff;border-color:hsl(var(--th) 80% 55%);box-shadow:0 0 0 1px hsl(var(--th) 80% 55%/.4),0 0 18px hsl(var(--th) 80% 55%/.25)}
.card{background:linear-gradient(160deg,#1a1a21,#111115);border:1px solid var(--line);border-radius:26px;padding:22px 18px 18px;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:-40% -20% auto auto;width:320px;height:320px;background:radial-gradient(circle,hsl(var(--h) 90% 55%/.18),transparent 65%);pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.big{font-size:64px;font-weight:200;line-height:1;letter-spacing:-.02em}
.name{font-size:15px;color:var(--mut);margin-top:6px}
.cnt{font-size:22px;font-weight:600;text-align:right}
.cnt small{display:block;font-size:12px;color:var(--mut);font-weight:400;margin-top:2px}
.scroll{overflow-x:auto;margin-top:18px;padding-bottom:6px;position:relative;scrollbar-width:thin}
.inner{position:relative;width:max-content;padding-top:16px}
.mon{position:absolute;top:0;font-size:10px;color:var(--mut)}
.grid{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:4px}
.d{width:14px;height:14px;border-radius:50%;border:1.5px solid #34343e;background:transparent;padding:0;cursor:pointer;transition:transform .12s}
.d:active{transform:scale(.7)}
.d.l1{background:hsl(var(--h) 40% 28%);border-color:transparent}
.d.l2{background:hsl(var(--h) 60% 40%);border-color:transparent}
.d.l3{background:hsl(var(--h) 75% 52%);border-color:transparent}
.d.l4{background:hsl(var(--h) 95% 66%);border-color:transparent;box-shadow:0 0 8px hsl(var(--h) 95% 60%/.7)}
.d.today{outline:2px solid #fff;outline-offset:1px}
.d.fut{opacity:.35;pointer-events:none}
.d.pad{visibility:hidden;pointer-events:none}
.leg{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--mut);position:relative}
.leg i{width:12px;height:12px;border-radius:50%;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.st{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.st b{display:block;font-size:24px;font-weight:600}
.st span{font-size:12px;color:var(--mut)}
.row{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:13px;border-radius:14px;font-size:14px;font-weight:600}
.btn.p{background:hsl(var(--h) 80% 50%);border-color:transparent;color:#06100a}
.btn.x{color:#ff6b6b}
.d.sel{box-shadow:0 0 0 2px hsl(var(--h) 90% 70%)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
.ph b{font-size:14px}
.lnk{background:none;border:0;color:hsl(var(--h) 85% 62%);font-size:14px;font-weight:600}
.pm{font-size:13px;color:var(--mut);margin:4px 0}
.it{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:16px}
.ck{width:28px;height:28px;border-radius:9px;border:1.5px solid #3a3a45;background:transparent;color:#06100a;font-size:16px;font-weight:700;flex:none;padding:0}
.ck.on{background:hsl(var(--h) 85% 58%);border-color:transparent}
.ck.rm{color:#ff6b6b;border-color:#4a2a2a}
.add{display:flex;gap:8px;margin-top:8px}
.add input{flex:1;min-width:0;background:#0f0f13;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:11px;font-size:16px}
.add .btn{flex:none;padding:11px 18px}
.hint{font-size:12px;color:var(--mut);text-align:center;margin-top:14px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:5}
.modal.show{display:flex}
.sheet{background:#1a1a21;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px}
.sheet h2{margin:0 0 14px;font-size:18px}
.sheet input{width:100%;background:#0f0f13;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:13px;font-size:16px;margin-bottom:12px}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 16px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid transparent}
.sw button.on{border-color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>● Dots</h1>
    <div class="yr"><button id="py">‹</button><span id="yl"></span><button id="ny">›</button></div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="card" id="card">
    <div class="top">
      <div><div class="big" id="big"></div><div class="name" id="nm"></div></div>
      <div class="cnt"><span id="cn"></span><small>Tage</small></div>
    </div>
    <div class="scroll" id="sc"><div class="inner" id="inner"></div></div>
    <div class="leg"><span>Weniger</span><i style="background:transparent;border:1.5px solid #34343e"></i><i id="g1"></i><i id="g2"></i><i id="g3"></i><i id="g4"></i><span>Mehr</span></div>
  </div>
  <div class="panel" id="panel"></div>
  <div class="stats">
    <div class="st"><b id="s1">0</b><span>Aktuelle Serie</span></div>
    <div class="st"><b id="s2">0</b><span>Beste Serie</span></div>
    <div class="st"><b id="s3">0%</b><span>Quote dieses Jahr</span></div>
  </div>
  <div class="row">
    <button class="btn p" id="today">Heute eintragen</button>
    <button class="btn" id="add">+ Neuer Tracker</button>
  </div>
  <div class="row"><button class="btn x" id="del">Tracker löschen</button></div>
  <p class="hint">Tippe auf einen Punkt, um den Tag auszuwählen und Unteraufgaben abzuhaken. Ohne Unteraufgaben wechselt jeder Tipp die Intensität 1–4.</p>
</div>

<div class="modal" id="modal"><div class="sheet">
  <h2>Neuer Tracker</h2>
  <input id="ni" placeholder="z. B. Sport, Lesen, Meditation" maxlength="24">
  <div class="sw" id="sw"></div>
  <div class="row" style="margin-top:0"><button class="btn" id="cx">Abbrechen</button><button class="btn p" id="ok">Erstellen</button></div>
</div></div>

<script>
const HUES=[150,12,210,280,45,330,185];
const KEY="dots-v1";
let S,cur=0,year=new Date().getFullYear(),newHue=HUES[0],armed=false;
const $=id=>document.getElementById(id);
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 if(!S||!S.t||!S.t.length){S={t:[{n:"Schlaf",h:210,d:{}},{n:"Sport",h:150,d:{}},{n:"Lesen",h:280,d:{}}]}}
 S.t.forEach(t=>{if(t.n==="Sport"&&!t.s)t.s=["Laufen","Krafttraining","Dehnen"]})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let sel=null,edit=false;
function lvl(t,k){if(t.s&&t.s.length){const c=((t.c&&t.c[k])||[]).filter(n=>t.s.includes(n)).length;if(c)return Math.max(1,Math.ceil(c/t.s.length*4))}return t.d[k]||0}
function toggle(t,n){t.c=t.c||{};const a=t.c[sel]||[];t.c[sel]=a.includes(n)?a.filter(x=>x!==n):a.concat(n);if(!t.c[sel].length)delete t.c[sel];save();render()}
function renderPanel(t){
 const p=$("panel");p.innerHTML="";
 const dd=new Date(sel+"T12:00:00"),list=t.s||[];
 const head=document.createElement("div");head.className="ph";
 head.innerHTML="<b></b><button class='lnk'></button>";
 head.firstChild.textContent=(list.length?"Erledigt am ":"Aufgaben für ")+dd.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
 const eb=head.lastChild;eb.textContent=edit?"Fertig":"Bearbeiten";eb.onclick=()=>{edit=!edit;render()};
 p.appendChild(head);
 if(!list.length&&!edit){const m=document.createElement("p");m.className="pm";m.textContent="Noch keine Unteraufgaben. Tippe auf Bearbeiten, z. B. für Laufen, Krafttraining oder Yoga.";p.appendChild(m)}
 const c=(t.c&&t.c[sel])||[];
 list.forEach(n=>{
  const r=document.createElement("div");r.className="it";
  const b=document.createElement("button");
  if(edit){b.className="ck rm";b.textContent="✕";b.onclick=()=>{t.s=t.s.filter(x=>x!==n);save();render()}}
  else{const on=c.includes(n);b.className="ck"+(on?" on":"");b.textContent=on?"✓":"";b.onclick=()=>toggle(t,n)}
  const s=document.createElement("span");s.textContent=n;if(!edit)s.onclick=b.onclick;
  r.append(b,s);p.appendChild(r)});
 if(edit){
  const a=document.createElement("div");a.className="add";
  a.innerHTML="<input id='si' maxlength='24' placeholder='Neue Unteraufgabe'><button class='btn p'>+</button>";
  const go=()=>{const v=a.firstChild.value.trim();if(!v||(t.s||[]).includes(v))return;t.s=(t.s||[]).concat(v);save();render();setTimeout(()=>{const i=$("si");i&&i.focus()},0)};
  a.lastChild.onclick=go;a.firstChild.onkeydown=e=>{if(e.key==="Enter")go()};
  p.appendChild(a)}
}
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function render(){
 const t=S.t[cur];
 document.documentElement.style.setProperty("--h",t.h);
 $("yl").textContent=year;$("big").textContent=year;$("nm").textContent=t.n;
 $("tabs").innerHTML="";
 S.t.forEach((x,i)=>{const b=document.createElement("button");b.className="tab"+(i===cur?" on":"");b.style.setProperty("--th",x.h);b.textContent=x.n;b.onclick=()=>{cur=i;armed=false;edit=false;render()};$("tabs").appendChild(b)});
 [1,2,3,4].forEach(l=>{const e=$("g"+l);e.style.background=["","hsl("+t.h+" 40% 28%)","hsl("+t.h+" 60% 40%)","hsl("+t.h+" 75% 52%)","hsl("+t.h+" 95% 66%)"][l]});
 const inner=$("inner");inner.innerHTML="";
 const g=document.createElement("div");g.className="grid";
 if(!sel)sel=key(new Date());
 const start=new Date(year,0,1),off=(start.getDay()+6)%7,tk=key(new Date()),now=new Date();now.setHours(0,0,0,0);
 for(let i=0;i<off;i++){const p=document.createElement("div");p.className="d pad";g.appendChild(p)}
 const months=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
 let cnt=0,tot=0,elapsed=0;
 for(let d=new Date(start);d.getFullYear()===year;d.setDate(d.getDate()+1)){
  const k=key(d),lv=lvl(t,k),b=document.createElement("button");
  b.className="d"+(lv?" l"+lv:"")+(k===tk?" today":"")+(k===sel?" sel":"")+(d>now?" fut":"");
  b.title=d.toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"});
  b.onclick=()=>{if(t.s&&t.s.length){sel=k;render();return}sel=k;t.d[k]=((t.d[k]||0)+1)%5;if(!t.d[k])delete t.d[k];save();render()};
  g.appendChild(b);
  if(d<=now){elapsed++;if(lv)cnt++}
  if(d.getDate()===1){const col=Math.floor((off+Math.round((d-start)/864e5))/7);const m=document.createElement("span");m.className="mon";m.style.left=col*18+"px";m.textContent=months[d.getMonth()];inner.appendChild(m)}
 }
 inner.appendChild(g);
 $("cn").textContent=cnt;
 $("s3").textContent=(elapsed?Math.round(cnt/elapsed*100):0)+"%";
 // streaks
 let best=0,run=0;
 for(let d=new Date(start);d.getFullYear()===year;d.setDate(d.getDate()+1)){if(lvl(t,key(d))){run++;best=Math.max(best,run)}else run=0}
 let cs=0,d=new Date(now);if(d.getFullYear()!==year)d=new Date(year,11,31);
 if(!lvl(t,key(d)))d.setDate(d.getDate()-1);
 while(d.getFullYear()===year&&lvl(t,key(d))){cs++;d.setDate(d.getDate()-1)}
 $("s1").textContent=cs;$("s2").textContent=best;
 $("del").textContent=armed?"Wirklich löschen? Nochmal tippen":"Tracker löschen";
 renderPanel(t);
}
function scrollToNow(){const sc=$("sc");const n=new Date();if(n.getFullYear()===year){const col=Math.floor(((new Date(year,0,1).getDay()+6)%7+Math.round((n-new Date(year,0,1))/864e5))/7);sc.scrollLeft=Math.max(0,col*18-sc.clientWidth/2)}else sc.scrollLeft=0}
$("py").onclick=()=>{year--;render();scrollToNow()};
$("ny").onclick=()=>{year++;render();scrollToNow()};
$("today").onclick=()=>{const t=S.t[cur],k=key(new Date());year=new Date().getFullYear();sel=k;if(t.s&&t.s.length){render();scrollToNow();$("panel").scrollIntoView({behavior:"smooth",block:"center"});return}t.d[k]=((t.d[k]||0)+1)%5;if(!t.d[k])delete t.d[k];save();render()};
$("del").onclick=()=>{if(S.t.length<2){$("del").textContent="Mindestens ein Tracker nötig";return}
 if(!armed){armed=true;render();return}
 S.t.splice(cur,1);cur=0;armed=false;save();render()};
function swatches(){$("sw").innerHTML="";HUES.forEach(h=>{const b=document.createElement("button");b.style.background="hsl("+h+" 80% 55%)";b.className=h===newHue?"on":"";b.onclick=()=>{newHue=h;swatches()};$("sw").appendChild(b)})}
$("add").onclick=()=>{newHue=HUES[S.t.length%HUES.length];swatches();$("ni").value="";$("modal").classList.add("show");setTimeout(()=>$("ni").focus(),50)};
$("cx").onclick=()=>$("modal").classList.remove("show");
$("ok").onclick=()=>{const n=$("ni").value.trim();if(!n)return;S.t.push({n,h:newHue,d:{}});cur=S.t.length-1;save();$("modal").classList.remove("show");render()};
load();render();scrollToNow();
</script>
</body>
</html>
